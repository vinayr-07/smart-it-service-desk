<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="100%" height="100%" style="background-color: #050811; font-family: 'Segoe UI', Inter, system-ui, sans-serif;">
  <defs>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <marker id="edgeArrow" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
    <marker id="edgeArrowImpact" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F43F5E" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="50" text-anchor="middle" fill="#F8FAFC" font-size="26" font-weight="800">
    NEO4J CMDB TOPOLOGY &amp; BLAST RADIUS GRAPH MODEL
  </text>
  <text x="700" y="78" text-anchor="middle" fill="#94A3B8" font-size="14">
    Configuration Item (CI) Nodes, Directed Dependencies, and Outage Impact Traversal
  </text>

  <!-- Level Legend Columns -->
  <text x="140" y="110" text-anchor="middle" fill="#818CF8" font-size="12" font-weight="700" letter-spacing="1">TIER 1: APPLICATIONS</text>
  <text x="420" y="110" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1">TIER 2: MICROSERVICES</text>
  <text x="700" y="110" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="700" letter-spacing="1">TIER 3: DATABASES</text>
  <text x="960" y="110" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700" letter-spacing="1">TIER 4: SERVERS</text>
  <text x="1220" y="110" text-anchor="middle" fill="#F43F5E" font-size="12" font-weight="700" letter-spacing="1">TIER 5: NETWORK &amp; SAN</text>

  <!-- Level separator lines -->
  <line x1="280" y1="120" x2="280" y2="780" stroke="#1E293B" stroke-dasharray="4,4" />
  <line x1="560" y1="120" x2="560" y2="780" stroke="#1E293B" stroke-dasharray="4,4" />
  <line x1="840" y1="120" x2="840" y2="780" stroke="#1E293B" stroke-dasharray="4,4" />
  <line x1="1100" y1="120" x2="1100" y2="780" stroke="#1E293B" stroke-dasharray="4,4" />

  <!-- ========================================================================= -->
  <!-- EDGES / RELATIONSHIPS -->
  <!-- ========================================================================= -->

  <!-- Normal Edges -->
  <line x1="140" y1="420" x2="420" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="140" y1="640" x2="420" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="420" y1="420" x2="420" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="420" y1="420" x2="700" y2="220" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="420" y1="420" x2="700" y2="420" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="420" y1="420" x2="700" y2="620" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />

  <line x1="420" y1="420" x2="960" y2="240" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="700" y1="220" x2="960" y2="600" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="700" y1="420" x2="960" y2="600" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />

  <line x1="960" y1="240" x2="1220" y2="240" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="960" y1="600" x2="1220" y2="240" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />
  <line x1="960" y1="600" x2="1220" y2="680" stroke="#64748B" stroke-width="1.5" marker-end="url(#edgeArrow)" />

  <!-- BLAST RADIUS FAILURE CHAIN (Highlighted in Red) -->
  <!-- SW-EDGE-02 (OUTAGE) -> SRV-BETA -> APP-ERP -->
  <line x1="1220" y1="460" x2="960" y2="420" stroke="#F43F5E" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#edgeArrowImpact)" />
  <line x1="960" y1="420" x2="140" y2="220" stroke="#F43F5E" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#edgeArrowImpact)" />

  <rect x="1030" y="420" width="120" height="20" rx="4" fill="#881337" stroke="#F43F5E" stroke-width="1" />
  <text x="1090" y="434" text-anchor="middle" fill="#FDA4AF" font-size="10" font-weight="700">1-Hop Blast Radius</text>

  <rect x="490" y="280" width="120" height="20" rx="4" fill="#881337" stroke="#F43F5E" stroke-width="1" />
  <text x="550" y="294" text-anchor="middle" fill="#FDA4AF" font-size="10" font-weight="700">2-Hop Blast Radius</text>

  <!-- ========================================================================= -->
  <!-- NODES -->
  <!-- ========================================================================= -->

  <!-- Tier 1: Applications -->
  <g id="node-app-erp" transform="translate(140, 220)" filter="url(#nodeGlow)">
    <circle r="36" fill="#1E1B4B" stroke="#F43F5E" stroke-width="3" />
    <text y="-4" text-anchor="middle" fill="#FDA4AF" font-size="11" font-weight="800">APP-ERP</text>
    <text y="12" text-anchor="middle" fill="#FDA4AF" font-size="9">DEGRADED</text>
  </g>

  <g id="node-app-pay" transform="translate(140, 420)" filter="url(#nodeGlow)">
    <circle r="36" fill="#1E1B4B" stroke="#4F46E5" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">APP-PAY</text>
    <text y="12" text-anchor="middle" fill="#6EE7B7" font-size="9">OPERATIONAL</text>
  </g>

  <g id="node-app-lms" transform="translate(140, 640)" filter="url(#nodeGlow)">
    <circle r="36" fill="#1E1B4B" stroke="#4F46E5" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">APP-LMS</text>
    <text y="12" text-anchor="middle" fill="#6EE7B7" font-size="9">OPERATIONAL</text>
  </g>

  <!-- Tier 2: Microservices -->
  <g id="node-svc-auth" transform="translate(420, 220)" filter="url(#nodeGlow)">
    <circle r="36" fill="#0C4A6E" stroke="#0284C7" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">SVC-AUTH</text>
    <text y="12" text-anchor="middle" fill="#BAE6FD" font-size="9">Azure SSO</text>
  </g>

  <g id="node-svc-api" transform="translate(420, 420)" filter="url(#nodeGlow)">
    <circle r="36" fill="#0C4A6E" stroke="#0284C7" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">SVC-API</text>
    <text y="12" text-anchor="middle" fill="#BAE6FD" font-size="9">API Gateway</text>
  </g>

  <!-- Tier 3: Databases -->
  <g id="node-db-mysql" transform="translate(700, 220)" filter="url(#nodeGlow)">
    <circle r="36" fill="#451A03" stroke="#D97706" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">DB-MYSQL</text>
    <text y="12" text-anchor="middle" fill="#FCD34D" font-size="9">MySQL Cluster</text>
  </g>

  <g id="node-db-neo4j" transform="translate(700, 420)" filter="url(#nodeGlow)">
    <circle r="36" fill="#451A03" stroke="#D97706" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">DB-NEO4J</text>
    <text y="12" text-anchor="middle" fill="#FCD34D" font-size="9">Graph CMDB</text>
  </g>

  <g id="node-db-redis" transform="translate(700, 620)" filter="url(#nodeGlow)">
    <circle r="36" fill="#451A03" stroke="#D97706" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">DB-REDIS</text>
    <text y="12" text-anchor="middle" fill="#FCD34D" font-size="9">Session Cache</text>
  </g>

  <!-- Tier 4: Servers -->
  <g id="node-srv-alpha" transform="translate(960, 240)" filter="url(#nodeGlow)">
    <circle r="36" fill="#064E3B" stroke="#059669" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">SRV-ALPHA</text>
    <text y="12" text-anchor="middle" fill="#A7F3D0" font-size="9">Host Node 1</text>
  </g>

  <g id="node-srv-beta" transform="translate(960, 420)" filter="url(#nodeGlow)">
    <circle r="36" fill="#881337" stroke="#F43F5E" stroke-width="3" />
    <text y="-4" text-anchor="middle" fill="#FDA4AF" font-size="11" font-weight="800">SRV-BETA</text>
    <text y="12" text-anchor="middle" fill="#FDA4AF" font-size="9">DEGRADED</text>
  </g>

  <g id="node-srv-db01" transform="translate(960, 600)" filter="url(#nodeGlow)">
    <circle r="36" fill="#064E3B" stroke="#059669" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">SRV-DB01</text>
    <text y="12" text-anchor="middle" fill="#A7F3D0" font-size="9">DB Host</text>
  </g>

  <!-- Tier 5: Network & Storage -->
  <g id="node-sw-core" transform="translate(1220, 240)" filter="url(#nodeGlow)">
    <circle r="36" fill="#1E293B" stroke="#64748B" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">SW-CORE-01</text>
    <text y="12" text-anchor="middle" fill="#94A3B8" font-size="9">Nexus 9300</text>
  </g>

  <g id="node-sw-edge" transform="translate(1220, 460)" filter="url(#nodeGlow)">
    <circle r="38" fill="#E11D48" stroke="#F43F5E" stroke-width="3.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800">SW-EDGE-02</text>
    <text y="12" text-anchor="middle" fill="#FEE2E2" font-size="9" font-weight="700">ROOT OUTAGE</text>
  </g>

  <g id="node-san-array" transform="translate(1220, 680)" filter="url(#nodeGlow)">
    <circle r="36" fill="#1E293B" stroke="#64748B" stroke-width="2.5" />
    <text y="-4" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">SAN-ARRAY</text>
    <text y="12" text-anchor="middle" fill="#94A3B8" font-size="9">NetApp 120TB</text>
  </g>
</svg>
