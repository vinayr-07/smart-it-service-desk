<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 860" width="100%" height="100%" style="background-color: #060913; font-family: 'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <!-- Node Drop Shadows -->
    <filter id="nodeGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#F43F5E" flood-opacity="0.6" />
    </filter>

    <marker id="edgeArrow" viewBox="0 0 10 10" refX="26" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="edgeArrowImpact" viewBox="0 0 10 10" refX="26" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F43F5E" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="725" y="46" text-anchor="middle" fill="#F8FAFC" font-size="26" font-weight="800" letter-spacing="-0.5">
    NEO4J CMDB TOPOLOGY &amp; BLAST RADIUS GRAPH MODEL
  </text>
  <text x="725" y="74" text-anchor="middle" fill="#94A3B8" font-size="14" font-weight="500">
    Configuration Item (CI) Nodes, Directed Dependencies, and Outage Impact Traversal
  </text>

  <!-- Column Tier Headers -->
  <rect x="50" y="95" width="220" height="26" rx="4" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
  <text x="160" y="112" text-anchor="middle" fill="#C7D2FE" font-size="11.5" font-weight="700">TIER 1: APPLICATIONS</text>

  <rect x="330" y="95" width="220" height="26" rx="4" fill="#0C4A6E" stroke="#0284C7" stroke-width="1" />
  <text x="440" y="112" text-anchor="middle" fill="#BAE6FD" font-size="11.5" font-weight="700">TIER 2: MICROSERVICES</text>

  <rect x="610" y="95" width="220" height="26" rx="4" fill="#451A03" stroke="#D97706" stroke-width="1" />
  <text x="720" y="112" text-anchor="middle" fill="#FDE68A" font-size="11.5" font-weight="700">TIER 3: DATABASES</text>

  <rect x="870" y="95" width="220" height="26" rx="4" fill="#064E3B" stroke="#059669" stroke-width="1" />
  <text x="980" y="112" text-anchor="middle" fill="#A7F3D0" font-size="11.5" font-weight="700">TIER 4: HOST SERVERS</text>

  <rect x="1130" y="95" width="240" height="26" rx="4" fill="#881337" stroke="#E11D48" stroke-width="1" />
  <text x="1250" y="112" text-anchor="middle" fill="#FDA4AF" font-size="11.5" font-weight="700">TIER 5: NETWORK &amp; STORAGE</text>

  <!-- Separator Guide Lines -->
  <line x1="300" y1="100" x2="300" y2="800" stroke="#1E293B" stroke-dasharray="4,4" stroke-width="1.2" />
  <line x1="580" y1="100" x2="580" y2="800" stroke="#1E293B" stroke-dasharray="4,4" stroke-width="1.2" />
  <line x1="850" y1="100" x2="850" y2="800" stroke="#1E293B" stroke-dasharray="4,4" stroke-width="1.2" />
  <line x1="1110" y1="100" x2="1110" y2="800" stroke="#1E293B" stroke-dasharray="4,4" stroke-width="1.2" />

  <!-- ========================================================================= -->
  <!-- STANDARD RELATIONSHIP EDGES (Rendered Behind Nodes) -->
  <!-- ========================================================================= -->

  <!-- APP-PAY -> SVC-API -->
  <line x1="160" y1="430" x2="440" y2="430" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- APP-LMS -> SVC-API -->
  <line x1="160" y1="650" x2="440" y2="430" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />

  <!-- SVC-API -> SVC-AUTH -->
  <line x1="440" y1="430" x2="440" y2="230" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- SVC-API -> DB-MYSQL -->
  <line x1="440" y1="430" x2="720" y2="230" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- SVC-API -> DB-NEO4J -->
  <line x1="440" y1="430" x2="720" y2="430" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- SVC-API -> DB-REDIS -->
  <line x1="440" y1="430" x2="720" y2="630" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />

  <!-- SVC-API -> SRV-ALPHA [:HOSTED_ON] -->
  <line x1="440" y1="430" x2="980" y2="240" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- DB-MYSQL -> SRV-DB01 [:HOSTED_ON] -->
  <line x1="720" y1="230" x2="980" y2="610" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- DB-NEO4J -> SRV-DB01 [:HOSTED_ON] -->
  <line x1="720" y1="430" x2="980" y2="610" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />

  <!-- SRV-ALPHA -> SW-CORE-01 [:CONNECTED_TO] -->
  <line x1="980" y1="240" x2="1250" y2="240" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- SRV-DB01 -> SW-CORE-01 [:CONNECTED_TO] -->
  <line x1="980" y1="610" x2="1250" y2="240" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />
  <!-- SRV-DB01 -> SAN-ARRAY-01 [:MOUNTED_ON] -->
  <line x1="980" y1="610" x2="1250" y2="690" stroke="#64748B" stroke-width="1.6" marker-end="url(#edgeArrow)" />

  <!-- ========================================================================= -->
  <!-- BLAST RADIUS TRAVERSAL PATH (Highlighted Crimson Flow) -->
  <!-- ========================================================================= -->

  <!-- SW-EDGE-02 -> SRV-BETA (1-Hop) -->
  <line x1="1250" y1="460" x2="980" y2="430" stroke="#F43F5E" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#edgeArrowImpact)" />
  <rect x="1055" y="425" width="130" height="22" rx="4" fill="#881337" stroke="#F43F5E" stroke-width="1" />
  <text x="1120" y="440" text-anchor="middle" fill="#FDA4AF" font-size="10.5" font-weight="700">1-Hop Blast Radius</text>

  <!-- SRV-BETA -> APP-ERP (2-Hop) -->
  <line x1="980" y1="430" x2="160" y2="230" stroke="#F43F5E" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#edgeArrowImpact)" />
  <rect x="510" y="315" width="130" height="22" rx="4" fill="#881337" stroke="#F43F5E" stroke-width="1" />
  <text x="575" y="330" text-anchor="middle" fill="#FDA4AF" font-size="10.5" font-weight="700">2-Hop Blast Radius</text>

  <!-- ========================================================================= -->
  <!-- CONFIGURATION ITEM (CI) NODES -->
  <!-- ========================================================================= -->

  <!-- Tier 1: Applications -->
  <g transform="translate(160, 230)" filter="url(#crimsonGlow)">
    <circle r="38" fill="#1E1B4B" stroke="#F43F5E" stroke-width="3" />
    <text y="-6" text-anchor="middle" fill="#FDA4AF" font-size="12" font-weight="800">APP-ERP</text>
    <text y="12" text-anchor="middle" fill="#FDA4AF" font-size="9.5" font-weight="700">DEGRADED</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">Student ERP Portal</text>
  </g>

  <g transform="translate(160, 430)" filter="url(#nodeGlow)">
    <circle r="38" fill="#1E1B4B" stroke="#4F46E5" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">APP-PAY</text>
    <text y="12" text-anchor="middle" fill="#6EE7B7" font-size="9.5" font-weight="700">OPERATIONAL</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">Fee Payment GW</text>
  </g>

  <g transform="translate(160, 650)" filter="url(#nodeGlow)">
    <circle r="38" fill="#1E1B4B" stroke="#4F46E5" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">APP-LMS</text>
    <text y="12" text-anchor="middle" fill="#6EE7B7" font-size="9.5" font-weight="700">OPERATIONAL</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">PESU Academy</text>
  </g>

  <!-- Tier 2: Microservices -->
  <g transform="translate(440, 230)" filter="url(#nodeGlow)">
    <circle r="38" fill="#0C4A6E" stroke="#0284C7" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">SVC-AUTH</text>
    <text y="12" text-anchor="middle" fill="#BAE6FD" font-size="9.5">Azure SSO</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">Port 8443 / Node</text>
  </g>

  <g transform="translate(440, 430)" filter="url(#nodeGlow)">
    <circle r="38" fill="#0C4A6E" stroke="#0284C7" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">SVC-API</text>
    <text y="12" text-anchor="middle" fill="#BAE6FD" font-size="9.5">Core Gateway</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">Port 443 / Envoy</text>
  </g>

  <!-- Tier 3: Databases -->
  <g transform="translate(720, 230)" filter="url(#nodeGlow)">
    <circle r="38" fill="#451A03" stroke="#D97706" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">DB-MYSQL</text>
    <text y="12" text-anchor="middle" fill="#FCD34D" font-size="9.5">MySQL 8.0</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">ERP Primary DB</text>
  </g>

  <g transform="translate(720, 430)" filter="url(#nodeGlow)">
    <circle r="38" fill="#451A03" stroke="#D97706" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">DB-NEO4J</text>
    <text y="12" text-anchor="middle" fill="#FCD34D" font-size="9.5">Graph Cluster</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">CMDB Topology</text>
  </g>

  <g transform="translate(720, 630)" filter="url(#nodeGlow)">
    <circle r="38" fill="#451A03" stroke="#D97706" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">DB-REDIS</text>
    <text y="12" text-anchor="middle" fill="#FCD34D" font-size="9.5">Session Cache</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">Port 6379 / In-Memory</text>
  </g>

  <!-- Tier 4: Servers -->
  <g transform="translate(980, 240)" filter="url(#nodeGlow)">
    <circle r="38" fill="#064E3B" stroke="#059669" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">SRV-ALPHA</text>
    <text y="12" text-anchor="middle" fill="#A7F3D0" font-size="9.5">Node-Alpha</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">192.168.10.11</text>
  </g>

  <g transform="translate(980, 430)" filter="url(#crimsonGlow)">
    <circle r="38" fill="#881337" stroke="#F43F5E" stroke-width="3" />
    <text y="-6" text-anchor="middle" fill="#FDA4AF" font-size="11.5" font-weight="800">SRV-BETA</text>
    <text y="12" text-anchor="middle" fill="#FDA4AF" font-size="9.5" font-weight="700">DEGRADED</text>
    <text y="58" text-anchor="middle" fill="#FDA4AF" font-size="10.5">192.168.10.12</text>
  </g>

  <g transform="translate(980, 610)" filter="url(#nodeGlow)">
    <circle r="38" fill="#064E3B" stroke="#059669" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">SRV-DB01</text>
    <text y="12" text-anchor="middle" fill="#A7F3D0" font-size="9.5">DB Host</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">192.168.20.15</text>
  </g>

  <!-- Tier 5: Network & Storage -->
  <g transform="translate(1250, 240)" filter="url(#nodeGlow)">
    <circle r="38" fill="#1E293B" stroke="#64748B" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">SW-CORE-01</text>
    <text y="12" text-anchor="middle" fill="#94A3B8" font-size="9.5">Nexus 9300</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">10G Core Backbone</text>
  </g>

  <g transform="translate(1250, 460)" filter="url(#crimsonGlow)">
    <circle r="42" fill="#E11D48" stroke="#F43F5E" stroke-width="3.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">SW-EDGE-02</text>
    <text y="12" text-anchor="middle" fill="#FEE2E2" font-size="9.5" font-weight="800">ROOT OUTAGE</text>
    <text y="62" text-anchor="middle" fill="#FDA4AF" font-size="10.5">192.168.1.25 (Flapping)</text>
  </g>

  <g transform="translate(1250, 690)" filter="url(#nodeGlow)">
    <circle r="38" fill="#1E293B" stroke="#64748B" stroke-width="2.5" />
    <text y="-6" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">SAN-ARRAY</text>
    <text y="12" text-anchor="middle" fill="#94A3B8" font-size="9.5">NetApp SAN</text>
    <text y="58" text-anchor="middle" fill="#94A3B8" font-size="10.5">120TB Enterprise LUN</text>
  </g>
</svg>
